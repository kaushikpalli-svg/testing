<html>
<head>
    <title>
        animation
    </title>
    <style>
        div
        {
            padding:100px 100px 100px 100px;
            width:300px;
            height:100px;
            background-color:red;
            animation-name: anime; 
            animation-duration: 10ms;
            animation-iteration-count: infinite;
        }
        @keyframes anime{
            0% {background-color:red;}

50% {background-color:rgb(194, 235, 13);}

100% {background-color:red;}
        }

    </style>
</head>
<body>
    <div><h1><b>special offer!!! buy our premium subscription for just 10$</b></h1></div>
</body>

</html>
